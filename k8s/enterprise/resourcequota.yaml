apiVersion: v1
kind: ResourceQuota
metadata:
  name: enterprise-quota
  namespace: enterprise
spec:
  hard:
    requests.cpu: "200m"
    requests.memory: 128Mi
    limits.cpu: "400m"
    limits.memory: 256Mi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: enterprise-limits
  namespace: enterprise
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 256Mi

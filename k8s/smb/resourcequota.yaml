apiVersion: v1
kind: ResourceQuota
metadata:
  name: notiflex-quota
  namespace: notiflex
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "1000m"
    limits.memory: 1Gi
    pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: notiflex-limits
  namespace: notiflex
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 256Mi
